name: Terraform DEV

on:
  push:
    branches:
      - dev

  workflow_dispatch:
    inputs:
      action:
        description: "Choose Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
      plan_run_id:
        description: "Required for apply: GitHub Actions run ID containing the approved plan artifact"
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.2"
  TF_WORKING_DIRECTORY: ${{ vars.TF_WORKING_DIRECTORY }}
  TF_VAR_FILE: ${{ vars.TF_VAR_FILE }}
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
  TFSTATE_KEY: ${{ vars.TFSTATE_KEY }}

jobs:

  plan:
    name: Terraform Plan
    if: github.event_name == 'push' || github.event.inputs.action == 'plan'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: |
          terraform init \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TFSTATE_CONTAINER}" \
            -backend-config="key=${TFSTATE_KEY}" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: |
          terraform plan \
            -var-file="${TF_VAR_FILE}" \
            -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: ${{ env.TF_WORKING_DIRECTORY }}/tfplan
          retention-days: 7