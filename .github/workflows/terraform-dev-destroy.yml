name: Terraform DEV Destroy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.2"

  TF_WORKING_DIRECTORY: ${{ vars.TF_WORKING_DIRECTORY }}
  TF_VAR_FILE: ${{ vars.TF_VAR_FILE }}

  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
  TFSTATE_KEY: ${{ vars.TFSTATE_KEY }}

  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:

  plan:
    name: Terraform Destroy Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: |
          terraform init \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TFSTATE_CONTAINER}" \
            -backend-config="key=${TFSTATE_KEY}" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="client_id=${AZURE_CLIENT_ID}" \
            -backend-config="tenant_id=${AZURE_TENANT_ID}" \
            -backend-config="subscription_id=${AZURE_SUBSCRIPTION_ID}"

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: terraform validate

      - name: Terraform Destroy Plan
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: |
          terraform plan -destroy \
            -var-file="${TF_VAR_FILE}" \
            -out=tfplan

      - name: Upload Terraform Destroy Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-destroy-plan
          path: ${{ env.TF_WORKING_DIRECTORY }}/tfplan
          retention-days: 7

  destroy:
    name: Terraform Destroy
    needs: plan
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: |
          terraform init \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TFSTATE_CONTAINER}" \
            -backend-config="key=${TFSTATE_KEY}" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="client_id=${AZURE_CLIENT_ID}" \
            -backend-config="tenant_id=${AZURE_TENANT_ID}" \
            -backend-config="subscription_id=${AZURE_SUBSCRIPTION_ID}"

      - name: Download Terraform Destroy Plan
        uses: actions/download-artifact@v5
        with:
          name: terraform-dev-destroy-plan
          path: ${{ env.TF_WORKING_DIRECTORY }}

      - name: Terraform Apply Destroy Plan
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: terraform apply -auto-approve tfplan